name: Verify blog

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Verify site
        run: python3 .github/scripts/verify-blog.py --output "$RUNNER_TEMP/blog-verification"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-verification
          path: |
            ${{ runner.temp }}/blog-verification/report.json
            ${{ runner.temp }}/blog-verification/logs
          if-no-files-found: warn
          retention-days: 7
