{{ if .Site.Params.openGraph.enable }}
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:title" content="{{ .Scratch.Get "metaTitle" | default .Title | default .Site.Title }}" />
<meta property="og:description" content="{{ .Scratch.Get "metaDescription" }}" />
{{- with .Scratch.Get "metaImage" -}}
  {{- with .url }}<meta property="og:image" content="{{ . }}" />{{ end }}
  {{- with .width }}<meta property="og:image:width" content="{{ . }}" />{{ end }}
  {{- with .height }}<meta property="og:image:height" content="{{ . }}" />{{ end }}
  {{- with .type }}<meta property="og:image:type" content="{{ . }}" />{{ end }}
{{- end -}}
<meta property="og:url" content="{{ .Scratch.Get "metaCanonical" | default .Permalink }}"/>
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:locale" content="{{ .Site.Language.Locale }}"/>
{{ if .IsPage }}
<meta property="article:author" content="{{ .Params.Author | default .Site.Params.Author }}" />
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" />
<meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}" />
{{ end }}
{{ end }}
