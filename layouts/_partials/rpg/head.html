{{- $page := .page -}}
{{ partial "head/meta.html" $page }}
{{ partial "head/opengraph.html" $page }}
{{ partial "head/twitter.html" $page }}
<title>{{ .title }} · {{ $page.Site.Title }}</title>
<meta name="theme-color" content="#141916" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{ .canonical }}">
{{ with $page.Site.Home.OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ $page.Site.Title }}" href="{{ .Permalink }}">{{ end }}
<script src="{{ "js/rpg-theme.js" | relURL }}"></script>
<link rel="stylesheet" href="{{ "css/rpg-home.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/rpg-pages.css" | relURL }}">
<link rel="stylesheet" href="{{ "css/rpg-theme.css" | relURL }}">
<script src="{{ "js/rpg-home.js" | relURL }}" defer></script>
{{ partialCached "head/script/analytics.html" $page }}
