# ===============================================================
# 根据如下的配置说明完善自己的站点配置，建议另外拷贝进行调整避免冲突
# Improve your site configuration according to the following 
# configuration instructions. It is recommended to make 
# additional copies for adjustment to avoid conflicts
# ===============================================================

# ---------------------------------------------------------------
# Hugo 引擎的基礎配置
# Basic configure for Hugo engine 
# ---------------------------------------------------------------

# 正式網站部署在 /blog/ 子路徑。
baseURL: https://iankingh.github.io/blog/
# 此參數設置影響的是若你想把站點內網址，從相對網址 /a/url，轉為絕對網址 http://your.baseurl.dev/a/url，你必須追加 canonifyURLs: true 配置到你的 config 檔案中，否則會使用預設的 false (不轉換)
# canonifyURLs: true
# 站點標題
# Website title
title: ianhuang筆記
# 站點默認的語言和代碼
# Default laguage & code for website
defaultContentLanguage: zh-tw
locale: zh-TW
# 是否包含中文，日语，韩文
# Whether contains Chinese, Japanese and Korean
hasCJKLanguage: true
# 每頁顯示文章數量
# Display items per page
pagination:
  pagerSize: 10
# 开启支持表情符号
# Enable Emoji support
enableEmoji: true
# 让 Makedown 文檔支持 HTML 語法，高亮，文章目录等功能
# Make markdown content support HTML syntax, highlight, toc etc.
markup:
  goldmark:
    renderer:
      # HTML/JavaScript 範例需使用 fenced code block；禁止執行文章中的原始 HTML。
      unsafe: false
  highlight:
    # # 高亮代码的样式名称，可选：monokai | emacs | api | dracula | friendly
    # # 更多的样式：https://xyproto.github.io/splash/docs/all.html
    # # Highlight style: monokai | emacs | api | dracula | friendly
    # # More: https://xyproto.github.io/splash/docs/all.html 
    # style: "monokai"
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: false
    noClasses: true
    noHl: false
    style: monokai
    tabWidth: 2
  tableOfContents:
    # 开始/结束标题级别：1-6 (建议从2开始)
    # Heading title level of start or end: 1-6
    # Recommand start at 2
    startLevel: 2
    endLevel: 4

# 站點文章導航文件
# Site map of all articles
sitemap:
  filename: "sitemap.xml"
  changefreq: "weekly"
  priority: 0.5

outputFormats:
  RSS:
    baseName: "rss"
  # 自定义生成本地搜索文件
  # Custom file of indexes for local search
  LocalIndexes:
    mediaType: application/xml
    baseName: searchindexes
    isPlainText: true
    notAlternative: true
  SearchIndex:
    mediaType: application/json
    baseName: search-index
    isPlainText: true
    notAlternative: true
outputs:
  home: ["HTML", "RSS", "LocalIndexes", "SearchIndex"]

# 输出 robots 文件支持爬虫扫描
# Enable robots with support crawler scan
enableRobotsTXT: true

# 强制输出时压缩文件
# Compress all files when output
minify:
  minifyOutput: true

#--------------------------------------
# 菜单配置说明
# identifier ： 唯一标识不可重复
# name       ： 菜单显示名称
# pageref    ： 本站点链接地址，与 URL 选其一
# url        ： 站点外部链接地址，以 http 或者 https 开头
# pre        ： 菜单小图标
# weight     ： 显示顺序，字数越小越靠前
# 
# Menus Settings
# identifier : Unique ID cannot be repeated
# name       : Menu name
# pageref    : Link of webiste and not appeare same time with url
# url        : Exteneral link out of website and start with http or https
# pre        : Icon of menu
# weight     : Order number and smaller is top
# -------------------------------------
menus:
  main:
    - identifier: home
      name: 首頁・冒險大廳
      pageref: /
      pre: home
      weight: 1
    - identifier: book
      name: 筆記・任務日誌
      pageref: /post/
      pre: book
      weight: 3
    - identifier: skills
      name: 技能・技能圖鑑
      pageref: /skills/
      pre: tree
      weight: 4
    - identifier: about
      name: 關於・角色檔案
      pageref: /about
      pre: user
      weight: 6
    - identifier: guestbook
      name: 留言板・想法營地
      pageref: /guestbook/
      pre: message
      weight: 5

